<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>പൂച്ചെണ്ടുകൾ ഫോർ മറിയം 💋</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap');

:root {
  --pink: #ffb6cc;
  --muted: #d9b9cb;
}

* { box-sizing: border-box; }

[hidden], .hide { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: #fff0f6;
  background:
    radial-gradient(ellipse at 50% 0%, #432039, transparent 55%),
    linear-gradient(145deg, #100c16, #1d1022 65%, #100c16);
  font-family: 'Poppins', sans-serif;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #ffe5ef;
  box-shadow: 0 0 10px #ffb6cc;
  animation: twinkle 3s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .15; transform: scale(.7); }
  to { opacity: .95; transform: scale(1.4); }
}

main {
  position: relative;
  z-index: 1;
  width: min(100% - 32px, 850px);
  margin: auto;
  padding: 45px 0 35px;
  text-align: center;
}

.eyebrow {
  color: var(--pink);
  text-transform: uppercase;
  letter-spacing: 4px;
  font-size: 10px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(30px, 7vw, 54px);
  font-weight: 400;
  line-height: 1.3;
  margin: 14px 0 10px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
  margin: 0 auto 24px;
}

.garden {
  position: relative;
  margin: 15px auto 18px;
  width: min(100%, 500px);
  aspect-ratio: 1 / .9;
  border: 1px solid rgba(255,182,204,.13);
  border-radius: 24px;
  background:
    radial-gradient(ellipse at 50% 55%, rgba(255,150,194,.10), transparent 63%),
    rgba(255,255,255,.055);
  box-shadow: 0 20px 80px rgba(0,0,0,.22);
  overflow: hidden;
}

#flowerSvg, #gardenSvg {
  width: 100%;
  height: 100%;
}

#flowerHead {
  transform-box: view-box;
  transform-origin: 200px 190px;
  animation: sway 4s ease-in-out infinite alternate;
}

@keyframes sway {
  from { transform: rotate(-3deg); }
  to { transform: rotate(3deg); }
}

#gardenGroup {
  transform-box: view-box;
  transform-origin: 200px 348px;
  animation: gardenSway 5s ease-in-out infinite alternate;
}

@keyframes gardenSway {
  from { transform: rotate(-1deg); }
  to { transform: rotate(1deg); }
}

/* Petals grow from small buds into their full shape */
.petal {
  transform-box: fill-box;
  transform-origin: center;
  animation: bloom 1s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes bloom {
  0% {
    opacity: 0;
    scale: .03;
  }
  70% {
    opacity: 1;
    scale: 1.08;
  }
  100% {
    opacity: 1;
    scale: 1;
  }
}

.leaf {
  transform-box: fill-box;
  transform-origin: bottom center;
  animation: leafSway 3.5s ease-in-out infinite alternate;
}

@keyframes leafSway {
  from { transform: rotate(-2deg); }
  to { transform: rotate(3deg); }
}

/* Garden stems grow up from the ground */
.stem {
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
  animation: grow .9s ease-out forwards;
}

@keyframes grow {
  to { stroke-dashoffset: 0; }
}

.gleaf {
  opacity: 0;
  animation: fadeIn .6s ease-out .5s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

.flower-name {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  margin: 8px 0 3px;
}

.flower-note {
  font-size: 12px;
  color: var(--muted);
  min-height: 22px;
}

.choices {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 20px 0 24px;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: 1px solid rgba(255,182,204,.25);
  border-radius: 30px;
  background: rgba(255,255,255,.04);
  color: #ffe9f1;
  padding: 10px 15px;
  font-size: 12px;
  transition: .25s ease;
}

button:hover,
button.active {
  background: rgba(255,182,204,.15);
  border-color: var(--pink);
  transform: translateY(-2px);
}

button:disabled {
  opacity: .3;
  cursor: not-allowed;
  transform: none;
}

/* Garden builder */
.builder {
  margin: 0 auto 24px;
  max-width: 500px;
  padding: 18px 20px;
  border: 1px solid rgba(255,182,204,.16);
  background: rgba(255,255,255,.035);
  border-radius: 18px;
}

.builder-total {
  font-size: 12px;
  color: var(--pink);
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.builder-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,182,204,.08);
  font-size: 14px;
}

.builder-row:last-of-type { border-bottom: none; }

.counter {
  display: flex;
  align-items: center;
  gap: 12px;
}

.counter .count {
  min-width: 34px;
  font-size: 13px;
  color: var(--muted);
}

.step {
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: 16px;
  line-height: 1;
  border-radius: 50%;
}

.builder-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 16px;
}

.letter {
  margin: 22px auto 0;
  max-width: 500px;
  padding: 22px;
  border: 1px solid rgba(255,182,204,.16);
  background: rgba(255,255,255,.035);
  border-radius: 18px;
}

.letter h2 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  font-size: 22px;
  margin: 0 0 10px;
}

.letter p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
  margin: 0;
}

footer {
  margin-top: 26px;
  color: #a98a9e;
  font-size: 10px;
  letter-spacing: 1px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>
<div class="stars" id="stars"></div>

<main>
  <div class="eyebrow">A little garden, just for you</div>

  <h1>പൂച്ചെണ്ടുകൾ ഫോർ മറിയം 💋</h1>
  <p class="subtitle">Choose a flower and watch it bloom.</p>

  <section class="garden" aria-label="Animated flower garden">
    <svg id="flowerSvg" viewBox="0 0 400 360" role="img" aria-label="An animated flower">
      <defs>
        <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#24553d"/>
          <stop offset="50%" stop-color="#70b77b"/>
          <stop offset="100%" stop-color="#28573c"/>
        </linearGradient>
      </defs>

      <path d="M200 190 Q190 260 201 340"
        fill="none" stroke="url(#stemGrad)"
        stroke-width="8" stroke-linecap="round"/>

      <g class="leaf">
        <path d="M199 280 Q130 220 110 260 Q145 300 199 280Z"
          fill="#3d8b59"/>
        <path d="M190 278 Q148 261 119 262"
          fill="none" stroke="#83c88d" stroke-width="1.5"/>
      </g>

      <g class="leaf">
        <path d="M202 310 Q260 252 286 285 Q258 323 202 310Z"
          fill="#34794d"/>
        <path d="M209 308 Q252 289 278 287"
          fill="none" stroke="#83c88d" stroke-width="1.5"/>
      </g>

      <g id="flowerHead"></g>
    </svg>

    <svg id="gardenSvg" class="hide" viewBox="0 0 400 360" role="img" aria-label="A garden of flowers">
      <defs>
        <radialGradient id="groundGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2f6b46" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#1b3b2a" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="352" rx="230" ry="30" fill="url(#groundGrad)"/>
      <g id="gardenGroup"></g>
    </svg>
  </section>

  <div class="flower-name" id="flowerName">Rose</div>
  <div class="flower-note" id="flowerNote">A little softness for your day.</div>

  <div class="choices" id="choices">
    <button class="active" data-flower="rose">🌹 Rose</button>
    <button data-flower="lily">🤍 Lily</button>
    <button data-flower="sunflower">🌻 Sunflower</button>
    <button data-flower="poppy">🌺 Poppy</button>
    <button data-flower="passionflower">💜 Passionflower</button>
    <button data-flower="garden">🌷 Build your garden</button>
  </div>

  <section class="builder" id="builder" hidden>
    <div class="builder-total" id="builderTotal">0 / 10 FLOWERS</div>
    <div id="builderRows"></div>
    <div class="builder-actions">
      <button id="bloomGarden" disabled>🌸 Bloom my garden</button>
      <button id="clearGarden">Clear</button>
    </div>
  </section>

  <section class="letter">
    <h2>പൂച്ചെണ്ടുകൾ ഫോർ മറിയം 💋</h2>
    <p>പൂച്ചെണ്ടുകൾ ഫോർ മറിയം 💋</p>
  </section>

  <footer>MADE WITH LOVE, JUST FOR YOU ✦</footer>
</main>

<script>
const stars = document.getElementById('stars');

for (let i = 0; i < 65; i++) {
  const star = document.createElement('span');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.animationDelay = Math.random() * 4 + 's';
  star.style.animationDuration = (2 + Math.random() * 3) + 's';
  stars.appendChild(star);
}

const flowers = {
  rose: {
    name: 'Rose',
    note: 'A little softness for your day.',
    petals: 18,
    rx: 19,
    ry: 38,
    color: '#e94c7c',
    light: '#ff9eb9',
    center: '#f8d16d',
    layers: 2
  },
  lily: {
    name: 'Lily',
    note: 'Elegant, gentle, and bright.',
    petals: 6,
    rx: 24,
    ry: 55,
    color: '#fff0f4',
    light: '#ffb6cc',
    center: '#f3c65d',
    layers: 1
  },
  sunflower: {
    name: 'Sunflower',
    note: 'A little sunshine wherever you go.',
    petals: 18,
    rx: 13,
    ry: 46,
    color: '#ffbf37',
    light: '#ffe78c',
    center: '#5e3325',
    layers: 1
  },
  poppy: {
    name: 'Poppy',
    note: 'A bright little burst of colour.',
    petals: 6,
    rx: 29,
    ry: 42,
    color: '#f0444c',
    light: '#ff9b9d',
    center: '#2a2028',
    layers: 1
  },
  passionflower: {
    name: 'Passionflower',
    note: 'A little wonder in every petal.',
    petals: 10,
    rx: 19,
    ry: 45,
    color: '#9870e8',
    light: '#e1c5ff',
    center: '#f4d26b',
    layers: 1
  }
};

const head = document.getElementById('flowerHead');
const flowerName = document.getElementById('flowerName');
const flowerNote = document.getElementById('flowerNote');
const NS = 'http://www.w3.org/2000/svg';

function svgElement(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([key, value]) => {
    el.setAttribute(key, value);
  });
  return el;
}

function addPetal(cx, cy, rx, ry, color, stroke, angle, delay) {
  // Wrapper: move to flower centre, then rotate, with an explicit origin
  const wrapper = svgElement('g', {
    style: `transform-box: view-box; transform-origin: 0 0; transform: translate(200px, 190px) rotate(${angle}deg);`
  });

  // Petal drawn relative to the flower centre (0,0)
  const petal = svgElement('ellipse', {
    cx: cx - 200,
    cy: cy - 190,
    rx,
    ry,
    fill: color,
    stroke,
    'stroke-width': 1,
    class: 'petal',
    style: `animation-delay:${delay}s`
  });

  wrapper.appendChild(petal);
  head.appendChild(wrapper);
}

function bloomFlower(type) {
  const f = flowers[type];
  head.replaceChildren();

  flowerName.textContent = f.name;
  flowerNote.textContent = f.note;

  // Outer layer: petals are distributed evenly around the centre.
  for (let i = 0; i < f.petals; i++) {
    const angle = (360 / f.petals) * i;

    addPetal(
      200,
      190 - f.ry * 0.57,
      f.rx,
      f.ry,
      f.color,
      f.light,
      angle,
      i * 0.055
    );
  }

  // Inner layer: offset the angles to fill the gaps between petals.
  if (f.layers > 1) {
    for (let i = 0; i < f.petals; i++) {
      const angle = (360 / f.petals) * i + 360 / (f.petals * 2);

      addPetal(
        200,
        190 - f.ry * 0.30,
        f.rx * 0.76,
        f.ry * 0.72,
        '#ff779b',
        f.light,
        angle,
        0.35 + i * 0.055
      );
    }
  }

  // Flower centre
  const centreRadius = type === 'sunflower' ? 25 : 14;

  const centre = svgElement('circle', {
    cx: 200,
    cy: 190,
    r: centreRadius,
    fill: f.center,
    stroke: f.light,
    'stroke-width': 2,
    class: 'petal',
    style: 'animation-delay:.55s'
  });

  head.appendChild(centre);

  // Small details inside the flower centre
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * (centreRadius - 3);

    head.appendChild(svgElement('circle', {
      cx: 200 + Math.cos(angle) * radius,
      cy: 190 + Math.sin(angle) * radius,
      r: Math.random() * 1.5 + .5,
      fill: type === 'sunflower' ? '#e9a43b' : '#ffe5a0',
      opacity: .85
    }));
  }

  // Delicate radial details for lily and passionflower
  if (type === 'lily' || type === 'passionflower') {
    for (let i = 0; i < 6; i++) {
      const angle = i * Math.PI / 3;
      const x1 = 200 + Math.cos(angle) * 12;
      const y1 = 190 + Math.sin(angle) * 12;
      const x2 = 200 + Math.cos(angle) * 34;
      const y2 = 190 + Math.sin(angle) * 34;

      head.appendChild(svgElement('line', {
        x1, y1, x2, y2,
        stroke: f.center,
        'stroke-width': 1.8,
        'stroke-linecap': 'round'
      }));

      head.appendChild(svgElement('circle', {
        cx: x2,
        cy: y2,
        r: 2.5,
        fill: f.center
      }));
    }
  }
}

/* ---------------- GARDEN MODE ---------------- */

const MAX_PER_FLOWER = 3;
const MAX_TOTAL = 10;
const GROUND_Y = 348;

const flowerSvg = document.getElementById('flowerSvg');
const gardenSvg = document.getElementById('gardenSvg');
const gardenGroup = document.getElementById('gardenGroup');
const builder = document.getElementById('builder');
const builderRows = document.getElementById('builderRows');
const builderTotal = document.getElementById('builderTotal');
const bloomBtn = document.getElementById('bloomGarden');
const clearBtn = document.getElementById('clearGarden');

const emojis = {
  rose: '🌹',
  lily: '🤍',
  sunflower: '🌻',
  poppy: '🌺',
  passionflower: '💜'
};

const counts = { rose: 0, lily: 0, sunflower: 0, poppy: 0, passionflower: 0 };

const totalCount = () => Object.values(counts).reduce((a, b) => a + b, 0);

/*
  Fixed layout of 10 slots: x, y (flower centre), scale.
  Three depth rows (back, middle, front) staggered so heads overlap and fill
  the whole frame. The order below makes any number of flowers (1 to 10)
  spread out evenly instead of clumping in one corner.
*/
const slots = [
  { x: 205, y: 172, s: 0.46 },  // middle centre
  { x: 62,  y: 255, s: 0.50 },  // front left
  { x: 340, y: 258, s: 0.50 },  // front right
  { x: 160, y: 98,  s: 0.38 },  // back
  { x: 300, y: 108, s: 0.37 },  // back
  { x: 105, y: 188, s: 0.44 },  // middle left
  { x: 310, y: 195, s: 0.44 },  // middle right
  { x: 60,  y: 120, s: 0.36 },  // back left
  { x: 355, y: 135, s: 0.35 },  // back right
  { x: 200, y: 252, s: 0.52 }   // front centre
];

function renderBuilder() {
  builderRows.replaceChildren();
  const total = totalCount();

  Object.keys(flowers).forEach(type => {
    const row = document.createElement('div');
    row.className = 'builder-row';

    const label = document.createElement('span');
    label.textContent = `${emojis[type]} ${flowers[type].name}`;

    const counter = document.createElement('div');
    counter.className = 'counter';

    const minus = document.createElement('button');
    minus.className = 'step';
    minus.textContent = '−';
    minus.disabled = counts[type] === 0;
    minus.addEventListener('click', () => {
      counts[type]--;
      renderBuilder();
    });

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `${counts[type]} / ${MAX_PER_FLOWER}`;

    const plus = document.createElement('button');
    plus.className = 'step';
    plus.textContent = '+';
    plus.disabled = counts[type] >= MAX_PER_FLOWER || total >= MAX_TOTAL;
    plus.addEventListener('click', () => {
      counts[type]++;
      renderBuilder();
    });

    counter.append(minus, count, plus);
    row.append(label, counter);
    builderRows.appendChild(row);
  });

  builderTotal.textContent = `${total} / ${MAX_TOTAL} FLOWERS`;
  bloomBtn.disabled = total === 0;
}

// Interleave types so the same flower is not placed in neighbouring slots
function buildFlowerList() {
  const types = Object.keys(counts).filter(t => counts[t] > 0);
  for (let i = types.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [types[i], types[j]] = [types[j], types[i]];
  }

  const left = {};
  types.forEach(t => left[t] = counts[t]);

  const list = [];
  while (list.length < totalCount()) {
    types.forEach(t => {
      if (left[t] > 0) {
        list.push(t);
        left[t]--;
      }
    });
  }
  return list;
}

function drawGardenFlower(parent, type, cx, cy, s, rot, delay) {
  const f = flowers[type];

  const addGPetal = (offsetY, rx, ry, color, angle, d) => {
    const wrapper = svgElement('g', {
      style: `transform-box: view-box; transform-origin: 0 0; transform: translate(${cx}px, ${cy}px) rotate(${angle}deg);`
    });

    wrapper.appendChild(svgElement('ellipse', {
      cx: 0,
      cy: -offsetY * s,
      rx: rx * s,
      ry: ry * s,
      fill: color,
      stroke: f.light,
      'stroke-width': 1,
      class: 'petal',
      style: `animation-delay:${d}s`
    }));

    parent.appendChild(wrapper);
  };

  for (let i = 0; i < f.petals; i++) {
    addGPetal(
      f.ry * 0.57, f.rx, f.ry, f.color,
      (360 / f.petals) * i + rot,
      delay + i * 0.03
    );
  }

  if (f.layers > 1) {
    for (let i = 0; i < f.petals; i++) {
      addGPetal(
        f.ry * 0.30, f.rx * 0.76, f.ry * 0.72, '#ff779b',
        (360 / f.petals) * i + 360 / (f.petals * 2) + rot,
        delay + 0.3 + i * 0.03
      );
    }
  }

  const centreRadius = (type === 'sunflower' ? 25 : 14) * s;

  parent.appendChild(svgElement('circle', {
    cx: cx,
    cy: cy,
    r: centreRadius,
    fill: f.center,
    stroke: f.light,
    'stroke-width': 1.2,
    class: 'petal',
    style: `animation-delay:${delay + 0.45}s`
  }));

  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * (centreRadius * 0.85);

    parent.appendChild(svgElement('circle', {
      cx: cx + Math.cos(a) * r,
      cy: cy + Math.sin(a) * r,
      r: (Math.random() * 1.5 + .5) * s * 1.6,
      fill: type === 'sunflower' ? '#e9a43b' : '#ffe5a0',
      opacity: .85
    }));
  }

  if (type === 'lily' || type === 'passionflower') {
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + rot * Math.PI / 180;
      const x2 = cx + Math.cos(a) * 34 * s;
      const y2 = cy + Math.sin(a) * 34 * s;

      parent.appendChild(svgElement('line', {
        x1: cx + Math.cos(a) * 12 * s,
        y1: cy + Math.sin(a) * 12 * s,
        x2, y2,
        stroke: f.center,
        'stroke-width': 1.2,
        'stroke-linecap': 'round'
      }));

      parent.appendChild(svgElement('circle', {
        cx: x2, cy: y2, r: 1.6, fill: f.center
      }));
    }
  }
}

function drawStem(parent, cx, cy, delay, side) {
  const endX = cx + (Math.random() * 24 - 12);
  const ctrlX = (cx + endX) / 2 + side * (8 + Math.random() * 10);
  const ctrlY = (cy + GROUND_Y) / 2;

  parent.appendChild(svgElement('path', {
    d: `M${cx} ${cy} Q${ctrlX} ${ctrlY} ${endX} ${GROUND_Y}`,
    fill: 'none',
    stroke: '#4f9a68',
    'stroke-width': 3.5,
    'stroke-linecap': 'round',
    class: 'stem',
    style: `animation-delay:${delay}s`
  }));

  // Small leaf on the stem
  const lx = (cx + ctrlX * 2 + endX) / 4;
  const ly = cy + (GROUND_Y - cy) * 0.62;
  const dir = -side;

  parent.appendChild(svgElement('path', {
    d: `M${lx} ${ly} q${dir * 22} -16 ${dir * 32} -2 q${dir * -14} 14 ${dir * -32} 2z`,
    fill: '#3d8b59',
    class: 'gleaf',
    style: `animation-delay:${delay + 0.4}s`
  }));
}

function bloomGardenNow() {
  gardenGroup.replaceChildren();

  const list = buildFlowerList();
  const n = list.length;

  // Fewer flowers: scale them up so the frame still looks full
  const boost = n <= 3 ? 1.35 : n <= 6 ? 1.15 : 1;

  const placed = list.map((type, i) => {
    const slot = slots[i];
    return {
      type,
      x: slot.x + (Math.random() * 8 - 4),
      y: slot.y + (Math.random() * 8 - 4),
      s: slot.s * boost,
      rot: Math.random() * 40,
      side: Math.random() < 0.5 ? -1 : 1,
      delay: Math.random() * 0.25
    };
  });

  // Back to front so front flowers overlap the back ones
  placed.sort((a, b) => a.y - b.y);

  placed.forEach(p => {
    drawStem(gardenGroup, p.x, p.y, p.delay, p.side);
    drawGardenFlower(gardenGroup, p.type, p.x, p.y, p.s, p.rot, p.delay + 0.5);
  });

  // Grass in front to tie everything together
  for (let i = 0; i < 46; i++) {
    const x = Math.random() * 400;
    const h = 14 + Math.random() * 20;
    const lean = Math.random() * 12 - 6;

    gardenGroup.appendChild(svgElement('path', {
      d: `M${x} ${GROUND_Y + 12} Q${x + lean / 2} ${GROUND_Y - h / 2} ${x + lean} ${GROUND_Y + 12 - h}`,
      fill: 'none',
      stroke: i % 2 ? '#3d8b59' : '#2f6b46',
      'stroke-width': 2,
      'stroke-linecap': 'round',
      opacity: .9
    }));
  }
}

function showGardenMode(on) {
  flowerSvg.classList.toggle('hide', on);
  gardenSvg.classList.toggle('hide', !on);
  builder.hidden = !on;

  if (on) {
    flowerName.textContent = 'Build your garden';
    flowerNote.textContent = 'Up to 3 of each flower, 10 in total.';
    renderBuilder();
    if (!gardenGroup.childNodes.length && totalCount() > 0) bloomGardenNow();
  }
}

bloomBtn.addEventListener('click', bloomGardenNow);

clearBtn.addEventListener('click', () => {
  Object.keys(counts).forEach(t => counts[t] = 0);
  gardenGroup.replaceChildren();
  renderBuilder();
});

document.querySelectorAll('#choices button').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('#choices button').forEach(b => {
      b.classList.remove('active');
    });

    button.classList.add('active');

    if (button.dataset.flower === 'garden') {
      showGardenMode(true);
    } else {
      showGardenMode(false);
      bloomFlower(button.dataset.flower);
    }
  });
});

bloomFlower('rose');
</script>
</body>
