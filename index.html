<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>പൂച്ചെണ്ടുകൾ ഫോർ മറിയം 💋</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap');

:root {
  --pink: #ffb6cc;
  --muted: #d9b9cb;
}

* { box-sizing: border-box; }

[hidden], .hide { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: #fff0f6;
  background:
    radial-gradient(ellipse at 50% 0%, #432039, transparent 55%),
    linear-gradient(145deg, #100c16, #1d1022 65%, #100c16);
  font-family: 'Poppins', sans-serif;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #ffe5ef;
  box-shadow: 0 0 10px #ffb6cc;
  animation: twinkle 3s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .15; transform: scale(.7); }
  to { opacity: .95; transform: scale(1.4); }
}

main {
  position: relative;
  z-index: 1;
  width: min(100% - 32px, 850px);
  margin: auto;
  padding: 45px 0 35px;
  text-align: center;
}

.eyebrow {
  color: var(--pink);
  text-transform: uppercase;
  letter-spacing: 4px;
  font-size: 10px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(30px, 7vw, 54px);
  font-weight: 400;
  line-height: 1.3;
  margin: 14px 0 10px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
  margin: 0 auto 24px;
}

.garden {
  position: relative;
  margin: 15px auto 18px;
  width: min(100%, 500px);
  aspect-ratio: 1 / .9;
  border: 1px solid rgba(255,182,204,.13);
  border-radius: 24px;
  background:
    radial-gradient(ellipse at 50% 55%, rgba(255,150,194,.10), transparent 63%),
    rgba(255,255,255,.055);
  box-shadow: 0 20px 80px rgba(0,0,0,.22);
  overflow: hidden;
}

#flowerSvg, #gardenSvg {
  width: 100%;
  height: 100%;
}

#flowerHead {
  transform-box: view-box;
  transform-origin: 200px 190px;
  animation: sway 4s ease-in-out infinite alternate;
}

@keyframes sway {
  from { transform: rotate(-3deg); }
  to { transform: rotate(3deg); }
}

#gardenGroup {
  transform-box: view-box;
  transform-origin: 200px 348px;
  animation: gardenSway 5s ease-in-out infinite alternate;
}

@keyframes gardenSway {
  from { transform: rotate(-1deg); }
  to { transform: rotate(1deg); }
}

/* Petals grow from small buds into their full shape */
.petal {
  transform-box: fill-box;
  transform-origin: center;
  animation: bloom 1s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes bloom {
  0% {
    opacity: 0;
    scale: .03;
  }
  70% {
    opacity: 1;
    scale: 1.08;
  }
  100% {
    opacity: 1;
    scale: 1;
  }
}

.leaf {
  transform-box: fill-box;
  transform-origin: bottom center;
  animation: leafSway 3.5s ease-in-out infinite alternate;
}

@keyframes leafSway {
  from { transform: rotate(-2deg); }
  to { transform: rotate(3deg); }
}

/* Garden stems grow up from the ground */
.stem {
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
  animation: grow .9s ease-out forwards;
}

@keyframes grow {
  to { stroke-dashoffset: 0; }
}

.gleaf {
  opacity: 0;
  animation: fadeIn .6s ease-out .5s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

.flower-name {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  margin: 8px 0 3px;
}

.flower-note {
  font-size: 12px;
  color: var(--muted);
  min-height: 22px;
}

.choices {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 20px 0 24px;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: 1px solid rgba(255,182,204,.25);
  border-radius: 30px;
  background: rgba(255,255,255,.04);
  color: #ffe9f1;
  padding: 10px 15px;
  font-size: 12px;
  transition: .25s ease;
}

button:hover,
button.active {
  background: rgba(255,182,204,.15);
  border-color: var(--pink);
  transform: translateY(-2px);
}

button:disabled {
  opacity: .3;
  cursor: not-allowed;
  transform: none;
}

/* Garden builder */
.builder {
  margin: 0 auto 24px;
  max-width: 500px;
  padding: 18px 20px;
  border: 1px solid rgba(255,182,204,.16);
  background: rgba(255,255,255,.035);
  border-radius: 18px;
}

.builder-total {
  font-size: 12px;
  color: var(--pink);
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.builder-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,182,204,.08);
  font-size: 14px;
}

.builder-row:last-of-type { border-bottom: none; }

.counter {
  display: flex;
  align-items: center;
  gap: 12px;
}

.counter .count {
  min-width: 34px;
  font-size: 13px;
  color: var(--muted);
}

.step {
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: 16px;
  line-height: 1;
  border-radius: 50%;
}

.builder-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 16px;
}

.letter {
  margin: 22px auto 0;
  max-width: 500px;
  padding: 22px;
  border: 1px solid rgba(255,182,204,.16);
  background: rgba(255,255,255,.035);
  border-radius: 18px;
}

.letter h2 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  font-size: 22px;
  margin: 0 0 10px;
}

.letter p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
  margin: 0;
}

/* Letter bouquet: shown inside the main garden frame */
.garden.bouquet-mode {
  width: min(100%, 560px);
  aspect-ratio: 1 / 1.05;
  background: #000;
}

#lilyStage {
  position: absolute;
  inset: 0;
  background: #000;
}

#lilyScreen {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: pointer;
}

footer {
  margin-top: 30px;
  color: #a98a9e;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: .5px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>
<div class="stars" id="stars"></div>

<main>
  <div class="eyebrow">A little garden, just for you</div>

  <h1>പൂച്ചെണ്ടുകൾ ഫോർ മറിയം 💋</h1>
  <p class="subtitle">Choose a flower and watch it bloom.</p>

  <section class="garden" aria-label="Animated flower garden">
    <svg id="flowerSvg" viewBox="0 0 400 360" role="img" aria-label="An animated flower">
      <defs>
        <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#24553d"/>
          <stop offset="50%" stop-color="#70b77b"/>
          <stop offset="100%" stop-color="#28573c"/>
        </linearGradient>
      </defs>

      <path d="M200 190 Q190 260 201 340"
        fill="none" stroke="url(#stemGrad)"
        stroke-width="8" stroke-linecap="round"/>

      <g class="leaf">
        <path d="M199 280 Q130 220 110 260 Q145 300 199 280Z"
          fill="#3d8b59"/>
        <path d="M190 278 Q148 261 119 262"
          fill="none" stroke="#83c88d" stroke-width="1.5"/>
      </g>

      <g class="leaf">
        <path d="M202 310 Q260 252 286 285 Q258 323 202 310Z"
          fill="#34794d"/>
        <path d="M209 308 Q252 289 278 287"
          fill="none" stroke="#83c88d" stroke-width="1.5"/>
      </g>

      <g id="flowerHead"></g>
    </svg>

    <svg id="gardenSvg" class="hide" viewBox="0 0 400 360" role="img" aria-label="A garden of flowers">
      <defs>
        <radialGradient id="groundGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2f6b46" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#1b3b2a" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="352" rx="230" ry="30" fill="url(#groundGrad)"/>
      <g id="gardenGroup"></g>
    </svg>

    <div id="lilyStage" class="hide">
      <canvas id="lilyScreen" role="img" aria-label="An animated bouquet of lilies made of text characters. Click to replay."></canvas>
    </div>
  </section>

  <div class="flower-name" id="flowerName">Rose</div>
  <div class="flower-note" id="flowerNote">A little softness for your day.</div>

  <div class="choices" id="choices">
    <button class="active" data-flower="rose">🌹 Rose</button>
    <button data-flower="lily">🤍 Lily</button>
    <button data-flower="sunflower">🌻 Sunflower</button>
    <button data-flower="poppy">🌺 Poppy</button>
    <button data-flower="passionflower">💜 Passionflower</button>
    <button data-flower="garden">🌷 Build your garden</button>
    <button data-flower="bouquet">💐 Letter Bouquet</button>
  </div>

  <div class="choices hide" id="lilyControls">
    <button id="lilyReplay" type="button">Replay</button>
    <button id="lilyPalette" type="button">Colours: Pink</button>
  </div>

  <section class="builder" id="builder" hidden>
    <div class="builder-total" id="builderTotal">0 / 10 FLOWERS</div>
    <div id="builderRows"></div>
    <div class="builder-actions">
      <button id="bloomGarden" disabled>🌸 Bloom my garden</button>
      <button id="clearGarden">Clear</button>
    </div>
  </section>

  <section class="letter">
    <h2>പൂച്ചെണ്ടുകൾ ഫോർ മറിയം 💋</h2>
    <p>പൂച്ചെണ്ടുകൾ ഫോർ മറിയം 💋</p>
  </section>

  <footer>- by Jijin</footer>
</main>

<script>
const stars = document.getElementById('stars');

for (let i = 0; i < 65; i++) {
  const star = document.createElement('span');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.animationDelay = Math.random() * 4 + 's';
  star.style.animationDuration = (2 + Math.random() * 3) + 's';
  stars.appendChild(star);
}

const flowers = {
  rose: {
    name: 'Rose',
    note: 'A little softness for your day.',
    petals: 18,
    rx: 19,
    ry: 38,
    color: '#e94c7c',
    light: '#ff9eb9',
    center: '#f8d16d',
    layers: 2
  },
  lily: {
    name: 'Lily',
    note: 'Elegant, gentle, and bright.',
    petals: 6,
    rx: 24,
    ry: 55,
    color: '#fff0f4',
    light: '#ffb6cc',
    center: '#f3c65d',
    layers: 1
  },
  sunflower: {
    name: 'Sunflower',
    note: 'A little sunshine wherever you go.',
    petals: 18,
    rx: 13,
    ry: 46,
    color: '#ffbf37',
    light: '#ffe78c',
    center: '#5e3325',
    layers: 1
  },
  poppy: {
    name: 'Poppy',
    note: 'A bright little burst of colour.',
    petals: 6,
    rx: 29,
    ry: 42,
    color: '#f0444c',
    light: '#ff9b9d',
    center: '#2a2028',
    layers: 1
  },
  passionflower: {
    name: 'Passionflower',
    note: 'A little wonder in every petal.',
    petals: 10,
    rx: 19,
    ry: 45,
    color: '#9870e8',
    light: '#e1c5ff',
    center: '#f4d26b',
    layers: 1
  }
};

const head = document.getElementById('flowerHead');
const flowerName = document.getElementById('flowerName');
const flowerNote = document.getElementById('flowerNote');
const NS = 'http://www.w3.org/2000/svg';

function svgElement(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([key, value]) => {
    el.setAttribute(key, value);
  });
  return el;
}

function addPetal(cx, cy, rx, ry, color, stroke, angle, delay) {
  // Wrapper: move to flower centre, then rotate, with an explicit origin
  const wrapper = svgElement('g', {
    style: `transform-box: view-box; transform-origin: 0 0; transform: translate(200px, 190px) rotate(${angle}deg);`
  });

  // Petal drawn relative to the flower centre (0,0)
  const petal = svgElement('ellipse', {
    cx: cx - 200,
    cy: cy - 190,
    rx,
    ry,
    fill: color,
    stroke,
    'stroke-width': 1,
    class: 'petal',
    style: `animation-delay:${delay}s`
  });

  wrapper.appendChild(petal);
  head.appendChild(wrapper);
}

function bloomFlower(type) {
  const f = flowers[type];
  head.replaceChildren();

  flowerName.textContent = f.name;
  flowerNote.textContent = f.note;

  // Outer layer: petals are distributed evenly around the centre.
  for (let i = 0; i < f.petals; i++) {
    const angle = (360 / f.petals) * i;

    addPetal(
      200,
      190 - f.ry * 0.57,
      f.rx,
      f.ry,
      f.color,
      f.light,
      angle,
      i * 0.055
    );
  }

  // Inner layer: offset the angles to fill the gaps between petals.
  if (f.layers > 1) {
    for (let i = 0; i < f.petals; i++) {
      const angle = (360 / f.petals) * i + 360 / (f.petals * 2);

      addPetal(
        200,
        190 - f.ry * 0.30,
        f.rx * 0.76,
        f.ry * 0.72,
        '#ff779b',
        f.light,
        angle,
        0.35 + i * 0.055
      );
    }
  }

  // Flower centre
  const centreRadius = type === 'sunflower' ? 25 : 14;

  const centre = svgElement('circle', {
    cx: 200,
    cy: 190,
    r: centreRadius,
    fill: f.center,
    stroke: f.light,
    'stroke-width': 2,
    class: 'petal',
    style: 'animation-delay:.55s'
  });

  head.appendChild(centre);

  // Small details inside the flower centre
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * (centreRadius - 3);

    head.appendChild(svgElement('circle', {
      cx: 200 + Math.cos(angle) * radius,
      cy: 190 + Math.sin(angle) * radius,
      r: Math.random() * 1.5 + .5,
      fill: type === 'sunflower' ? '#e9a43b' : '#ffe5a0',
      opacity: .85
    }));
  }

  // Delicate radial details for lily and passionflower
  if (type === 'lily' || type === 'passionflower') {
    for (let i = 0; i < 6; i++) {
      const angle = i * Math.PI / 3;
      const x1 = 200 + Math.cos(angle) * 12;
      const y1 = 190 + Math.sin(angle) * 12;
      const x2 = 200 + Math.cos(angle) * 34;
      const y2 = 190 + Math.sin(angle) * 34;

      head.appendChild(svgElement('line', {
        x1, y1, x2, y2,
        stroke: f.center,
        'stroke-width': 1.8,
        'stroke-linecap': 'round'
      }));

      head.appendChild(svgElement('circle', {
        cx: x2,
        cy: y2,
        r: 2.5,
        fill: f.center
      }));
    }
  }
}

/* ---------------- GARDEN MODE ---------------- */

const MAX_PER_FLOWER = 3;
const MAX_TOTAL = 10;
const GROUND_Y = 348;

const flowerSvg = document.getElementById('flowerSvg');
const gardenSvg = document.getElementById('gardenSvg');
const gardenGroup = document.getElementById('gardenGroup');
const builder = document.getElementById('builder');
const builderRows = document.getElementById('builderRows');
const builderTotal = document.getElementById('builderTotal');
const bloomBtn = document.getElementById('bloomGarden');
const clearBtn = document.getElementById('clearGarden');

const emojis = {
  rose: '🌹',
  lily: '🤍',
  sunflower: '🌻',
  poppy: '🌺',
  passionflower: '💜'
};

const counts = { rose: 0, lily: 0, sunflower: 0, poppy: 0, passionflower: 0 };

const totalCount = () => Object.values(counts).reduce((a, b) => a + b, 0);

/*
  Fixed layout of 10 slots: x, y (flower centre), scale.
  Three depth rows (back, middle, front) staggered so heads overlap and fill
  the whole frame. The order below makes any number of flowers (1 to 10)
  spread out evenly instead of clumping in one corner.
*/
const slots = [
  { x: 205, y: 172, s: 0.46 },  // middle centre
  { x: 62,  y: 255, s: 0.50 },  // front left
  { x: 340, y: 258, s: 0.50 },  // front right
  { x: 160, y: 98,  s: 0.38 },  // back
  { x: 300, y: 108, s: 0.37 },  // back
  { x: 105, y: 188, s: 0.44 },  // middle left
  { x: 310, y: 195, s: 0.44 },  // middle right
  { x: 60,  y: 120, s: 0.36 },  // back left
  { x: 355, y: 135, s: 0.35 },  // back right
  { x: 200, y: 252, s: 0.52 }   // front centre
];

function renderBuilder() {
  builderRows.replaceChildren();
  const total = totalCount();

  Object.keys(flowers).forEach(type => {
    const row = document.createElement('div');
    row.className = 'builder-row';

    const label = document.createElement('span');
    label.textContent = `${emojis[type]} ${flowers[type].name}`;

    const counter = document.createElement('div');
    counter.className = 'counter';

    const minus = document.createElement('button');
    minus.className = 'step';
    minus.textContent = '−';
    minus.disabled = counts[type] === 0;
    minus.addEventListener('click', () => {
      counts[type]--;
      renderBuilder();
    });

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `${counts[type]} / ${MAX_PER_FLOWER}`;

    const plus = document.createElement('button');
    plus.className = 'step';
    plus.textContent = '+';
    plus.disabled = counts[type] >= MAX_PER_FLOWER || total >= MAX_TOTAL;
    plus.addEventListener('click', () => {
      counts[type]++;
      renderBuilder();
    });

    counter.append(minus, count, plus);
    row.append(label, counter);
    builderRows.appendChild(row);
  });

  builderTotal.textContent = `${total} / ${MAX_TOTAL} FLOWERS`;
  bloomBtn.disabled = total === 0;
}

// Interleave types so the same flower is not placed in neighbouring slots
function buildFlowerList() {
  const types = Object.keys(counts).filter(t => counts[t] > 0);
  for (let i = types.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [types[i], types[j]] = [types[j], types[i]];
  }

  const left = {};
  types.forEach(t => left[t] = counts[t]);

  const list = [];
  while (list.length < totalCount()) {
    types.forEach(t => {
      if (left[t] > 0) {
        list.push(t);
        left[t]--;
      }
    });
  }
  return list;
}

function drawGardenFlower(parent, type, cx, cy, s, rot, delay) {
  const f = flowers[type];

  const addGPetal = (offsetY, rx, ry, color, angle, d) => {
    const wrapper = svgElement('g', {
      style: `transform-box: view-box; transform-origin: 0 0; transform: translate(${cx}px, ${cy}px) rotate(${angle}deg);`
    });

    wrapper.appendChild(svgElement('ellipse', {
      cx: 0,
      cy: -offsetY * s,
      rx: rx * s,
      ry: ry * s,
      fill: color,
      stroke: f.light,
      'stroke-width': 1,
      class: 'petal',
      style: `animation-delay:${d}s`
    }));

    parent.appendChild(wrapper);
  };

  for (let i = 0; i < f.petals; i++) {
    addGPetal(
      f.ry * 0.57, f.rx, f.ry, f.color,
      (360 / f.petals) * i + rot,
      delay + i * 0.03
    );
  }

  if (f.layers > 1) {
    for (let i = 0; i < f.petals; i++) {
      addGPetal(
        f.ry * 0.30, f.rx * 0.76, f.ry * 0.72, '#ff779b',
        (360 / f.petals) * i + 360 / (f.petals * 2) + rot,
        delay + 0.3 + i * 0.03
      );
    }
  }

  const centreRadius = (type === 'sunflower' ? 25 : 14) * s;

  parent.appendChild(svgElement('circle', {
    cx: cx,
    cy: cy,
    r: centreRadius,
    fill: f.center,
    stroke: f.light,
    'stroke-width': 1.2,
    class: 'petal',
    style: `animation-delay:${delay + 0.45}s`
  }));

  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * (centreRadius * 0.85);

    parent.appendChild(svgElement('circle', {
      cx: cx + Math.cos(a) * r,
      cy: cy + Math.sin(a) * r,
      r: (Math.random() * 1.5 + .5) * s * 1.6,
      fill: type === 'sunflower' ? '#e9a43b' : '#ffe5a0',
      opacity: .85
    }));
  }

  if (type === 'lily' || type === 'passionflower') {
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + rot * Math.PI / 180;
      const x2 = cx + Math.cos(a) * 34 * s;
      const y2 = cy + Math.sin(a) * 34 * s;

      parent.appendChild(svgElement('line', {
        x1: cx + Math.cos(a) * 12 * s,
        y1: cy + Math.sin(a) * 12 * s,
        x2, y2,
        stroke: f.center,
        'stroke-width': 1.2,
        'stroke-linecap': 'round'
      }));

      parent.appendChild(svgElement('circle', {
        cx: x2, cy: y2, r: 1.6, fill: f.center
      }));
    }
  }
}

function drawStem(parent, cx, cy, delay, side) {
  const endX = cx + (Math.random() * 24 - 12);
  const ctrlX = (cx + endX) / 2 + side * (8 + Math.random() * 10);
  const ctrlY = (cy + GROUND_Y) / 2;

  parent.appendChild(svgElement('path', {
    d: `M${cx} ${cy} Q${ctrlX} ${ctrlY} ${endX} ${GROUND_Y}`,
    fill: 'none',
    stroke: '#4f9a68',
    'stroke-width': 3.5,
    'stroke-linecap': 'round',
    class: 'stem',
    style: `animation-delay:${delay}s`
  }));

  // Small leaf on the stem
  const lx = (cx + ctrlX * 2 + endX) / 4;
  const ly = cy + (GROUND_Y - cy) * 0.62;
  const dir = -side;

  parent.appendChild(svgElement('path', {
    d: `M${lx} ${ly} q${dir * 22} -16 ${dir * 32} -2 q${dir * -14} 14 ${dir * -32} 2z`,
    fill: '#3d8b59',
    class: 'gleaf',
    style: `animation-delay:${delay + 0.4}s`
  }));
}

function bloomGardenNow() {
  gardenGroup.replaceChildren();

  const list = buildFlowerList();
  const n = list.length;

  // Fewer flowers: scale them up so the frame still looks full
  const boost = n <= 3 ? 1.35 : n <= 6 ? 1.15 : 1;

  const placed = list.map((type, i) => {
    const slot = slots[i];
    return {
      type,
      x: slot.x + (Math.random() * 8 - 4),
      y: slot.y + (Math.random() * 8 - 4),
      s: slot.s * boost,
      rot: Math.random() * 40,
      side: Math.random() < 0.5 ? -1 : 1,
      delay: Math.random() * 0.25
    };
  });

  // Back to front so front flowers overlap the back ones
  placed.sort((a, b) => a.y - b.y);

  placed.forEach(p => {
    drawStem(gardenGroup, p.x, p.y, p.delay, p.side);
    drawGardenFlower(gardenGroup, p.type, p.x, p.y, p.s, p.rot, p.delay + 0.5);
  });

  // Grass in front to tie everything together
  for (let i = 0; i < 46; i++) {
    const x = Math.random() * 400;
    const h = 14 + Math.random() * 20;
    const lean = Math.random() * 12 - 6;

    gardenGroup.appendChild(svgElement('path', {
      d: `M${x} ${GROUND_Y + 12} Q${x + lean / 2} ${GROUND_Y - h / 2} ${x + lean} ${GROUND_Y + 12 - h}`,
      fill: 'none',
      stroke: i % 2 ? '#3d8b59' : '#2f6b46',
      'stroke-width': 2,
      'stroke-linecap': 'round',
      opacity: .9
    }));
  }
}

function showGardenMode(on) {
  flowerSvg.classList.toggle('hide', on);
  gardenSvg.classList.toggle('hide', !on);
  builder.hidden = !on;

  if (on) {
    flowerName.textContent = 'Build your garden';
    flowerNote.textContent = 'Up to 3 of each flower, 10 in total.';
    renderBuilder();
    if (!gardenGroup.childNodes.length && totalCount() > 0) bloomGardenNow();
  }
}

bloomBtn.addEventListener('click', bloomGardenNow);

clearBtn.addEventListener('click', () => {
  Object.keys(counts).forEach(t => counts[t] = 0);
  gardenGroup.replaceChildren();
  renderBuilder();
});

const gardenBox = document.querySelector('.garden');
const lilyStage = document.getElementById('lilyStage');
const lilyControls = document.getElementById('lilyControls');

function showBouquetMode(on) {
  gardenBox.classList.toggle('bouquet-mode', on);
  lilyStage.classList.toggle('hide', !on);
  lilyControls.classList.toggle('hide', !on);

  if (on) {
    flowerSvg.classList.add('hide');
    gardenSvg.classList.add('hide');
    flowerName.textContent = 'The Letter Bouquet';
    flowerNote.textContent = "Lilies, ruscus and baby's breath, drawn with letters.";
    window.dispatchEvent(new Event('lily-replay'));
  }
}

document.querySelectorAll('#choices button').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('#choices button').forEach(b => {
      b.classList.remove('active');
    });

    button.classList.add('active');
    showBouquetMode(false);

    const kind = button.dataset.flower;

    } else if (kind === 'bouquet') {
      showGardenMode(false);
      showBouquetMode(true);
    } else {
      showGardenMode(false);
      bloomFlower(kind);
    }
  });
});

<script>
(() => {
  'use strict';

  const RAMP = ' .:-=+*cxoaX#%&@';
  const WORLD_W = 1000;
  const WORLD_H = 1100;
  const FPS = 30;

  const PALETTES = [
    { name: 'Pink',
      petal: '#f39ab2', edge: '#f9c3d2', blush: '#d99aa6', throat: '#c9dc78', vein: 'rgba(170,40,80,0.45)',
      anther: '#4a1d10', spots: true,
    },
    { name: 'White',
      petal: '#f6f2ea', edge: '#ffffff', blush: '#d8dcc0', throat: '#c8d87a', vein: 'rgba(120,130,90,0.4)',
      anther: '#8a3a16', spots: false,
    },
    { name: 'Mixed',
      petal: ['#e3233a', '#d24aa9', '#f08a2a', '#e9c63c', '#f1e4c6', '#f39ab2'], edge: null,
      blush: '#c98a7a', throat: '#e8d070', vein: 'rgba(80,10,20,0.45)', anther: '#3a160a', spots: true,
    },
  ];

  // ---------- helpers ----------
  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const prog = (T, start, dur) => clamp((T - start) / dur, 0, 1);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
  const rad = (d) => (d * Math.PI) / 180;

  function rgbOf(c) {
    if (c[0] === '#') {
      const n = parseInt(c.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    return c.match(/\d+/g).slice(0, 3).map(Number);
  }
  function mix(a, b, t) {
    const A = rgbOf(a), B = rgbOf(b);
    return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
  }

  function bez(p, t) {
    const u = 1 - t;
    return [
      u * u * u * p[0][0] + 3 * u * u * t * p[1][0] + 3 * u * t * t * p[2][0] + t * t * t * p[3][0],
      u * u * u * p[0][1] + 3 * u * u * t * p[1][1] + 3 * u * t * t * p[2][1] + t * t * t * p[3][1],
    ];
  }
  function bezAngle(p, t) {
    const a = bez(p, Math.max(0, t - 0.01)), b = bez(p, Math.min(1, t + 0.01));
    return Math.atan2(b[1] - a[1], b[0] - a[0]);
  }

  // Gentle breeze: higher points drift further, so the whole bunch bends together.
  let T = 0;
  function sway(x, y) {
    const lift = clamp((1090 - y) / 800, 0, 1);
    return [x + Math.sin(T * 0.9 + y * 0.006) * 8 * lift + Math.sin(T * 0.43 + x * 0.004) * 4 * lift, y];
  }

  // ---------- scene ----------
  // Timeline (seconds): stems rise, leaves unfurl, buds swell and blush, then open one by one.
  const STEM_START = 0, STEM_DUR = 2.6;
  const LEAF_START = 1.0;
  const BUD_START = 2.2;
  const BLUSH_START = 3.6;
  const OPEN_START = 5.0, OPEN_GAP = 0.85, OPEN_DUR = 3.2;

  function buildScene() {
    const r = rng(11);
    const S = { stems: [], leaves: [], buds: [] };

    // [top x, top y, side pedicels]
    const tops = [
      [310, 470, 2], [395, 360, 2], [500, 300, 3], [600, 350, 2],
      [700, 420, 2], [740, 500, 1], [350, 560, 1], [650, 560, 1],
    ];
    for (const [tx, ty, sides] of tops) {
      const bx = 485 + r() * 30;
      const stem = [[bx, 1090], [bx + (tx - bx) * 0.1, 860], [lerp(bx, tx, 0.7), ty + 220], [tx, ty]];
      const lean = (tx - 500) * 0.1;
      const stemRef = { pts: stem, start: STEM_START + r() * 0.4 };
      S.stems.push(stemRef);

      // lance-shaped leaves spiral up the middle of each stem
      const n = 5 + Math.floor(r() * 3);
      for (let i = 0; i < n; i++) {
        const t = 0.22 + (i / n) * 0.5 + r() * 0.04;
        const side = i % 2 ? 1 : -1;
        S.leaves.push({
          stem, t, side, len: 85 + r() * 55, w: 13 + r() * 6,
          spread: rad(28 + r() * 26), start: LEAF_START + t * 1.5 + r() * 0.3, tint: r(),
        });
      }

      // buds: one at the tip, the rest on short pedicels branching just below it
      S.buds.push({ stem, stemRef, at: 1, ped: null, dir: rad(-90 + lean + (r() - 0.5) * 10) });
      for (let k = 0; k < sides; k++) {
        const side = k % 2 ? 1 : -1;
        const at = 0.82 + r() * 0.12;
        const base = bez(stem, at);
        const ang = rad(-90 + lean + side * (30 + r() * 25));
        const len = 40 + r() * 45;
        const end = [base[0] + Math.cos(ang) * len, base[1] + Math.sin(ang) * len];
        const ped = [base, [lerp(base[0], end[0], 0.3), base[1] - len * 0.35], [lerp(base[0], end[0], 0.8), lerp(base[1], end[1], 0.7)], end];
        S.buds.push({ stem, stemRef, at, ped, dir: ang });
      }
    }

    // decide each bud's fate: about half open fully, a few only blush, the rest stay green
    const order = S.buds.map((_, i) => i).sort(() => r() - 0.5);
    order.forEach((idx, rank) => {
      const b = S.buds[idx];
      b.len = 120 + r() * 40;
      b.width = 19 + r() * 5;
      b.squash = 0.6 + r() * 0.25;
      b.twist = (r() - 0.5) * 0.8;
      b.droop = rad((b.dir > rad(-90) ? 1 : -1) * (15 + r() * 20));
      b.colorIdx = rank;
      b.rnd = Array.from({ length: 12 }, r);
      b.grow = BUD_START + r() * 1.2;
      if (rank < 7) {
        b.maxOpen = 1; b.blush = 1; b.openAt = OPEN_START + rank * OPEN_GAP + r() * 0.3;
      } else if (rank < 11) {
        b.maxOpen = 0.08; b.blush = 0.8; b.openAt = OPEN_START + 2 + r() * 4;
      } else {
        b.maxOpen = 0; b.blush = 0.1 + r() * 0.2; b.openAt = Infinity; b.len *= 0.75;
      }
    });
    addFillers(S);
    return S;
  }

  // Ruscus and baby's breath fill out the bunch around the lilies.
  const RUSCUS_START = 0.6;
  const GYP_START = 2.4;

  function addFillers(S) {
    const r = rng(29);
    S.ruscus = [];
    S.gyp = [];

    // ruscus: long arching sprigs with glossy leaves alternating up the stem
    const sprig = (base, ang, len, start, depth) => {
      const end = [base[0] + Math.cos(ang) * len, base[1] + Math.sin(ang) * len];
      const bend = (r() - 0.5) * len * 0.3;
      const pts = [base, [lerp(base[0], end[0], 0.33) + bend, lerp(base[1], end[1], 0.33)],
        [lerp(base[0], end[0], 0.7) + bend * 0.5, lerp(base[1], end[1], 0.7)], end];
      const leaves = [];
      for (let t = 0.2 + r() * 0.08, i = 0; t <= 1; t += 0.075 + r() * 0.035, i++) {
        leaves.push({ t, side: i % 2 ? 1 : -1, len: 34 + r() * 18, w: 10 + r() * 4, tint: r() });
      }
      leaves.push({ t: 1, side: 0, len: 46 + r() * 16, w: 11, tint: r() });
      S.ruscus.push({ pts, leaves, start });
      if (depth > 0) {
        for (let k = 0; k < 2; k++) {
          const t = 0.35 + r() * 0.35;
          const p = bez(pts, t);
          const side = k ? 1 : -1;
          sprig(p, ang + side * rad(25 + r() * 20), len * (0.4 + r() * 0.2), start + t * 1.4, depth - 1);
        }
      }
    };
    // a few sprigs tucked behind the lilies, ending just inside the bouquet's outline
    for (const end of [[210, 560], [270, 340], [420, 215], [600, 205], [750, 320], [810, 560]]) {
      const base = [490 + r() * 20, 820 - r() * 40];
      const ang = Math.atan2(end[1] - base[1], end[0] - base[0]);
      sprig(base, ang, Math.hypot(end[0] - base[0], end[1] - base[1]), RUSCUS_START + r() * 0.8, 0);
    }

    // baby's breath: thin stems that fork again and again into clouds of tiny white flowers
    // small sprays tucked between the lilies, as in a florist's bouquet
    const clouds = [
      [340, 460], [660, 430], [500, 330], [280, 610], [740, 610],
      [450, 610], [590, 640], [400, 340], [620, 340], [520, 520],
    ];
    clouds.forEach(([cx, cy], ci) => {
      const base = [485 + r() * 30, 1000 + r() * 60];
      const start = GYP_START + ci * 0.12 + r() * 0.4;
      const outward = Math.atan2(cy - 620, cx - 500);
      const segs = [], flowers = [];
      const branch = (x, y, ang, len, depth, t) => {
        const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
        segs.push({ x, y, x2, y2, t, w: 1.5 + depth * 0.8 });
        const t2 = t + 0.18;
        if (depth === 0) {
          flowers.push({ x: x2, y: y2, s: 4.5 + r() * 3.5, t: t2 + r() * 0.3, puffs: 2 + Math.floor(r() * 2) });
          return;
        }
        if (depth < 3 && r() < 0.75) flowers.push({ x: x2, y: y2, s: 3.5 + r() * 2.5, t: t2 + r() * 0.3, puffs: 1 });
        const kids = 2 + (r() < 0.45 ? 1 : 0);
        for (let k = 0; k < kids; k++) {
          const spread = rad(lerp(-70, 70, kids === 1 ? 0.5 : k / (kids - 1)) + (r() - 0.5) * 30);
          // children lean back toward upward/outward so the cloud stays rounded
          const target = lerp(ang + spread, outward, 0.25);
          branch(x2, y2, target, len * (0.4 + r() * 0.45), depth - 1, t2);
        }
      };
      const main = [[base[0], base[1]], [lerp(base[0], cx, 0.2), lerp(base[1], cy, 0.5)], [lerp(base[0], cx, 0.8), cy + 60], [cx, cy + 40]];
      branch(cx, cy + 40, outward * 0.5 - Math.PI / 4, 40 + r() * 10, 4, 0.6);
      S.gyp.push({ main, segs, flowers, start, front: ci % 2 === 1 });
    });
  }

  // ---------- drawing ----------
  function strokeCurve(g, pts, from, upto, width, color) {
    if (upto <= from) return;
    const N = 36;
    g.beginPath();
    for (let i = 0; i <= N; i++) {
      const p = bez(pts, lerp(from, upto, i / N));
      const q = sway(p[0], p[1]);
      i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]);
    }
    g.lineWidth = width;
    g.strokeStyle = color;
    g.lineCap = 'round';
    g.stroke();
  }

  function stemProgress(st) {
    return easeInOut(prog(T, st.start, STEM_DUR));
  }

  function drawLeaf(g, lf) {
    const p = easeOut(prog(T, lf.start, 1.4));
    if (!p) return;
    const a = bez(lf.stem, lf.t);
    const [x, y] = sway(a[0], a[1]);
    const ang = bezAngle(lf.stem, lf.t) + lf.side * lf.spread * (0.4 + 0.6 * p);
    const L = lf.len * p, W = lf.w * (0.4 + 0.6 * p);
    g.save();
    g.translate(x, y);
    g.rotate(ang);
    // the tip arches away from the stem
    const bend = lf.side * L * 0.18;
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(L * 0.3, -W, L * 0.7, -W * 0.8 + bend * 0.5, L, bend);
    g.bezierCurveTo(L * 0.7, W * 0.8 + bend * 0.5, L * 0.3, W, 0, 0);
    const grad = g.createLinearGradient(0, 0, L, 0);
    grad.addColorStop(0, '#2e6e22');
    grad.addColorStop(0.5, lf.tint > 0.5 ? '#4c9a2e' : '#3f8a2a');
    grad.addColorStop(1, '#78bc44');
    g.fillStyle = grad;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.55)';
    g.lineWidth = 5;
    g.stroke();
    g.strokeStyle = 'rgba(20,60,15,0.8)';
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(L * 0.6, bend * 0.3, L * 0.95, bend * 0.95); g.stroke();
    g.restore();
  }

  // One tepal along +x. Closed, six of these overlap into the club-shaped bud;
  // open, they fan out and their tips curl back.
  function tepal(g, L, W, color, edge, throat, vein, open, curl, spots, rnd) {
    const rc = smooth(0.45, 1, open);
    const tipX = L * (1 - 0.12 * rc), tipY = curl * W * 1.6 * rc;
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(L * 0.3, -W * 0.85, L * 0.72, -W * 1.05 + tipY * 0.3, tipX, tipY);
    g.bezierCurveTo(L * 0.72, W * 1.05 + tipY * 0.3, L * 0.3, W * 0.85, 0, 0);
    const grad = g.createLinearGradient(0, 0, L, 0);
    grad.addColorStop(0, throat);
    grad.addColorStop(lerp(0.45, 0.22, open), color);
    grad.addColorStop(1, edge);
    g.fillStyle = grad;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.65)';
    g.lineWidth = 6;
    g.stroke();
    // seam on the bud, nectar groove on the open tepal
    g.strokeStyle = open > 0.2 ? vein : 'rgba(40,70,20,0.55)';
    g.lineWidth = 5;
    g.beginPath(); g.moveTo(L * 0.05, 0); g.quadraticCurveTo(L * 0.6, tipY * 0.2, tipX * 0.94, tipY * 0.9); g.stroke();
    if (spots && open > 0.6) {
      g.fillStyle = `rgba(110,15,40,${(open - 0.6) * 2})`;
      for (let i = 0; i < 4; i++) {
        g.beginPath();
        g.arc(L * (0.18 + rnd[i] * 0.22), (rnd[i + 4] - 0.5) * W * 0.8, 3.5, 0, Math.PI * 2);
        g.fill();
      }
    }
  }

  function budState(b) {
    const grow = easeOut(prog(T, b.grow, 2.2));
    const blush = smooth(0, 1, prog(T, BLUSH_START + (b.grow - BUD_START), 2.5)) * b.blush;
    const open = easeInOut(prog(T, b.openAt, OPEN_DUR)) * b.maxOpen;
    return { grow, blush, open };
  }

  function drawBud(g, b, pal) {
    const sp = stemProgress(b.stemRef);
    if (b.ped) {
      if (sp < b.at) return;
      const pp = easeOut(prog(T, b.stemRef.start + STEM_DUR * b.at, 1.0));
      strokeCurve(g, b.ped, 0, pp, 5, '#5f9a34');
      if (pp < 0.6) return;
    } else if (sp < 0.98) {
      return;
    }
    const { grow, blush, open } = budState(b);
    if (!grow) return;

    const base = b.ped ? b.ped[3] : bez(b.stem, 1);
    const [x, y] = sway(base[0], base[1]);
    const multi = Array.isArray(pal.petal);
    const petal = multi ? pal.petal[b.colorIdx % pal.petal.length] : pal.petal;
    const edge = pal.edge || mix(petal, '#ffffff', 0.25);

    // bud colour: green -> dusty pink as it matures -> petal colour as it opens
    const budCol = mix('#9cc63e', pal.blush, blush);
    const color = mix(budCol, petal, smooth(0.05, 0.45, open));
    const edgeCol = mix(mix('#b4d860', pal.blush, blush), edge, smooth(0.05, 0.45, open));
    const throat = mix('#8fbf3a', pal.throat, open);

    const L = b.len * (0.3 + 0.7 * grow) * (1 + 0.3 * open);
    const W = b.width * (0.6 + 0.4 * grow) * (1 + 1.4 * open);

    g.save();
    g.translate(x, y);
    g.rotate(b.dir + b.droop * open);
    g.scale(1, lerp(1, b.squash, open));
    // short green receptacle where the bud meets the pedicel
    g.fillStyle = '#5f9a34';
    g.beginPath(); g.ellipse(0, 0, 9, 7, 0, 0, Math.PI * 2); g.fill();
    g.rotate(b.twist * open);
    // back three tepals first, then the front three
    for (const k of [3, 1, -1, 2, -2, 0]) {
      g.save();
      g.rotate(rad(k * 60) * open);
      const wob = 1 + (b.rnd[(k + 3) % 12] - 0.5) * 0.12 * open;
      tepal(g, L * wob, W, color, edgeCol, throat, pal.vein, open, k === 0 ? 0.3 : Math.sign(k) || 1, pal.spots, b.rnd);
      g.restore();
    }
    // stamens and pistil reach out once the tepals have parted
    const st = smooth(0.55, 1, open);
    if (st > 0) {
      for (let i = 0; i < 6; i++) {
        const a = rad(-28 + i * 11);
        const l = L * 0.72 * st * (0.92 + b.rnd[i] * 0.16);
        g.strokeStyle = '#d6dca8';
        g.lineWidth = 3;
        g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(l * 0.5, a * l * 0.3, Math.cos(a) * l, Math.sin(a) * l); g.stroke();
        g.fillStyle = pal.anther;
        g.beginPath(); g.ellipse(Math.cos(a) * l, Math.sin(a) * l, 11, 4.5, a + Math.PI / 2, 0, Math.PI * 2); g.fill();
      }
      const pl = L * 0.82 * st;
      g.strokeStyle = '#cfe0a0';
      g.lineWidth = 4;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(pl, 0); g.stroke();
      g.fillStyle = '#86a83c';
      g.beginPath(); g.arc(pl, 0, 7, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  function leafShape(g, L, W, bend) {
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(L * 0.25, -W, L * 0.7, -W * 0.8 + bend * 0.5, L, bend);
    g.bezierCurveTo(L * 0.7, W * 0.8 + bend * 0.5, L * 0.25, W, 0, 0);
  }

  function drawRuscus(g, S) {
    for (const sp of S.ruscus) {
      const p = easeOut(prog(T, sp.start, 2.2));
      if (!p) continue;
      strokeCurve(g, sp.pts, 0, p, 4, '#4f7a34');
      for (const lf of sp.leaves) {
        const lp = easeOut(prog(p, lf.t - 0.04, 0.22));
        if (!lp) continue;
        const a = bez(sp.pts, lf.t);
        const [x, y] = sway(a[0], a[1]);
        g.save();
        g.translate(x, y);
        g.rotate(bezAngle(sp.pts, lf.t) + lf.side * rad(38));
        const L = lf.len * lp, W = lf.w * lp;
        leafShape(g, L, W, lf.side * L * 0.08);
        const grad = g.createLinearGradient(0, -W, L, W);
        grad.addColorStop(0, lf.tint > 0.5 ? '#356a2c' : '#2c5f30');
        grad.addColorStop(0.55, lf.tint > 0.5 ? '#5aa046' : '#4c9240');
        grad.addColorStop(1, '#3a7436');
        g.fillStyle = grad;
        g.fill();
        g.strokeStyle = 'rgba(0,0,0,0.6)';
        g.lineWidth = 4;
        g.stroke();
        g.strokeStyle = 'rgba(150,190,110,0.5)';
        g.lineWidth = 2;
        g.beginPath(); g.moveTo(0, 0); g.lineTo(L * 0.85, lf.side * L * 0.06); g.stroke();
        g.restore();
      }
    }
  }

  function drawGyp(g, S, front) {
    for (const c of S.gyp) {
      if (c.front !== front) continue;
      const p = prog(T, c.start, 3.2);
      if (!p) continue;
      strokeCurve(g, c.main, 0, easeOut(Math.min(1, p * 3)), 3, '#6b8a4a');
      const local = p * 3.2 - 0.6; // seconds since the branching began
      g.strokeStyle = '#6f8f50';
      for (const sg of c.segs) {
        const k = clamp((local - sg.t) / 0.25, 0, 1);
        if (!k) continue;
        const [x, y] = sway(sg.x, sg.y), [x2, y2] = sway(sg.x2, sg.y2);
        g.lineWidth = sg.w;
        g.beginPath(); g.moveTo(x, y); g.lineTo(lerp(x, x2, k), lerp(y, y2, k)); g.stroke();
      }
      for (const f of c.flowers) {
        const k = easeOut(clamp((local - f.t) / 0.5, 0, 1));
        if (!k) continue;
        const [x, y] = sway(f.x, f.y);
        const tw = 0.88 + 0.12 * Math.sin(T * 2.5 + f.x * 0.3);
        g.fillStyle = `rgba(252,250,244,${tw})`;
        for (let i = 0; i < f.puffs; i++) {
          g.beginPath();
          g.arc(x + (i - (f.puffs - 1) / 2) * f.s * 0.9, y - (i % 2) * f.s * 0.6, f.s * k, 0, Math.PI * 2);
          g.fill();
        }
      }
    }
  }

  function drawScene(g, S, pal) {
    drawRuscus(g, S);
    drawGyp(g, S, false);
    for (const st of S.stems) strokeCurve(g, st.pts, 0, stemProgress(st), 9, '#5a9a30');
    for (const lf of S.leaves) drawLeaf(g, lf);
    // closed buds behind, then open flowers in the order they opened
    const sorted = S.buds.slice().sort((a, b) => budState(a).open - budState(b).open || (a.openAt - b.openAt || 0));
    for (const b of sorted) drawBud(g, b, pal);
    drawGyp(g, S, true);
  }

  // ---------- ascii renderer ----------
  const stage = document.getElementById('lilyStage');
  const screen = document.getElementById('lilyScreen');
  const replayBtn = document.getElementById('lilyReplay');
  const paletteBtn = document.getElementById('lilyPalette');
  if (!stage || !screen) return;

  const sctx = screen.getContext('2d');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });
  const hasFilter = 'filter' in sctx;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let cols = 0, rows = 0, cellW = 0, cellH = 0, fontSize = 0, dpr = 1;
  const styleCache = new Map();
  function style(r, g, b) {
    const key = (r << 16) | (g << 8) | b;
    let s = styleCache.get(key);
    if (!s) { s = `rgb(${r},${g},${b})`; styleCache.set(key, s); }
    return s;
  }

  function resize() {
    const rect = stage.getBoundingClientRect();
    const w = Math.floor(rect.width), h = Math.floor(rect.height);
    if (w < 20 || h < 20) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    fontSize = clamp(Math.floor(Math.min(w / 100, h / 85)), 5, 11);
    // setting canvas.width resets the context, so the font must be set after it
    screen.width = Math.floor(w * dpr);
    screen.height = Math.floor(h * dpr);
    sctx.font = `bold ${fontSize}px Menlo, Consolas, "DejaVu Sans Mono", monospace`;
    cellW = sctx.measureText('M').width || fontSize * 0.6;
    cellH = fontSize;
    cols = Math.ceil(w / cellW);
    rows = Math.ceil(h / cellH);
    off.width = cols;
    off.height = rows;
    render(S, PALETTES[palette]);
  }

  function render(S, pal) {
    if (!cols || !rows) return;
    // paint the scene into the low-res buffer, correcting for tall character cells
    const aspect = cellH / cellW;
    const sx = Math.min(cols / WORLD_W, (rows * aspect) / WORLD_H) * 0.96;
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.fillStyle = '#000';
    octx.fillRect(0, 0, cols, rows);
    octx.setTransform(sx, 0, 0, sx / aspect, (cols - WORLD_W * sx) / 2, (rows - (WORLD_H * sx) / aspect) / 2);

    drawScene(octx, S, pal);

    const data = octx.getImageData(0, 0, cols, rows).data;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.fillStyle = '#000';
    sctx.fillRect(0, 0, screen.width, screen.height);
    // soft glow under the glyphs; skipped where canvas blur is unsupported (older Safari)
    if (hasFilter) {
      sctx.save();
      sctx.globalAlpha = 0.42;
      sctx.filter = `blur(${Math.round(cellH * 0.4)}px)`;
      sctx.imageSmoothingEnabled = true;
      sctx.drawImage(off, 0, 0, cols * cellW, rows * cellH);
      sctx.restore();
    }
    sctx.textBaseline = 'top';
    const n = RAMP.length - 1;
    const flick = Math.floor(T * 8);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = (y * cols + x) * 4;
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const m = Math.max(r, g, b);
        if (m < 14) continue;
        const v = m / 255;
        // a little shimmer so the glyphs feel alive
        const h = ((x * 73856093) ^ (y * 19349663) ^ (flick * 83492791)) >>> 0;
        const j = h % 7 === 0 ? (h & 8 ? 1 : -1) : 0;
        const idx = clamp(Math.round(Math.pow(v, 0.7) * n) + j, 1, n);
        const k = Math.min(1.25, (40 + 215 * v) / m);
        sctx.fillStyle = style(Math.min(255, (r * k) | 0) & 0xf8, Math.min(255, (g * k) | 0) & 0xf8, Math.min(255, (b * k) | 0) & 0xf8);
        sctx.fillText(RAMP[idx], x * cellW, y * cellH);
      }
    }
  }

  // ---------- loop ----------
  // Runs only while the section is on screen, and starts the bloom from the beginning
  // the first time it scrolls into view.
  const S = buildScene();
  let palette = 0;
  let running = false, rafId = 0, lastNow = null, seen = false;

  function frame(now) {
    if (!running) return;
    rafId = requestAnimationFrame(frame);
    if (lastNow === null) { lastNow = now; return; }
    const dt = now - lastNow;
    if (dt < 1000 / FPS) return;
    lastNow = now;
    T += Math.min(dt, 100) / 1000;
    render(S, PALETTES[palette]);
  }
  function start() {
    if (running || reduced) return;
    running = true; lastNow = null;
    rafId = requestAnimationFrame(frame);
  }
  function stop() {
    running = false;
    cancelAnimationFrame(rafId);
  }
  function replay() {
    T = 0;
    if (reduced) { T = 15; render(S, PALETTES[palette]); }
  }

  if (replayBtn) replayBtn.addEventListener('click', replay);
  window.addEventListener('lily-replay', replay);
  screen.addEventListener('click', replay);
  if (paletteBtn) {
    paletteBtn.addEventListener('click', () => {
      palette = (palette + 1) % PALETTES.length;
      paletteBtn.textContent = 'Colours: ' + PALETTES[palette].name;
      replay();
    });
  }

  if (reduced) {
    // no motion: show the finished bouquet once
    T = 15;
    if (replayBtn) replayBtn.hidden = true;
  }

  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
  else window.addEventListener('resize', resize);
  resize();

  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {
          if (!seen) { seen = true; T = reduced ? 15 : 0; }
          start();
        } else {
          stop();
        }
      }
    }, { threshold: 0.25 }).observe(stage);
  } else {
    start();
  }
})();
</script>
</body>
</html>
